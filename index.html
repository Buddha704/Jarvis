<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#080b09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">

  <title>JARVIS</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside id="sidebar">

    <div class="brand">
      <div class="logo">J</div>

      <div>
        <b>JARVIS</b>
        <small>PERSONAL AI</small>
      </div>
    </div>

    <button id="newChat" class="primary">
      + New chat
    </button>

    <div class="label">
      CHATS
    </div>

    <div id="chatList" class="chat-list"></div>

    <div class="side-bottom">

      <button id="clearChats" class="ghost">
        Clear chats
      </button>

      <div id="status" class="status">
        <span></span>
        Starting...
      </div>

    </div>

  </aside>


  <main>

    <header>

      <button id="menu" class="icon">
        ☰
      </button>

      <div class="mobile-title">
        <div class="logo sm">J</div>
        <b>JARVIS</b>
      </div>

      <div class="model">
        Local browser AI
      </div>

    </header>


    <section id="chat" class="chat">

      <div id="welcome" class="welcome">

        <div class="big-logo">
          J
        </div>

        <h1>
          JARVIS
        </h1>

        <p>
          AI running directly on your device.
        </p>


        <div class="cards">

          <button data-prompt="Explain a difficult topic to me step by step.">
            <b>Explain</b>
            <span>Learn something complicated</span>
          </button>

          <button data-prompt="Help me solve this problem carefully and give me the answer.">
            <b>Reason</b>
            <span>Work through a problem</span>
          </button>

          <button data-prompt="Help me write high-quality code and explain the important parts.">
            <b>Code</b>
            <span>Build and debug software</span>
          </button>

          <button data-prompt="Help me make a detailed plan for a project.">
            <b>Plan</b>
            <span>Turn an idea into steps</span>
          </button>

        </div>


        <div id="loadPanel" class="load-panel">

          <b>Start Jarvis</b>

          <p id="progressText">
            Checking your device...
          </p>

          <div class="progress">
            <div id="progressBar"></div>
          </div>

          <button id="startAI" class="primary">
            Start Jarvis AI
          </button>

        </div>

      </div>


      <div id="messages" class="messages"></div>

    </section>


    <div class="composer-wrap">

      <div id="files" class="files"></div>

      <div class="composer">

        <button
          id="attach"
          class="icon attach"
          title="Attach files">
          +
        </button>

        <input
          id="fileInput"
          type="file"
          multiple
          hidden
          accept=".txt,.md,.csv,.json,.html,.css,.js,.py,.java,.cpp,.c,.h,.xml,.yaml,.yml,.log,image/*">

        <textarea
          id="input"
          rows="1"
          placeholder="Message Jarvis..."
          disabled></textarea>

        <button
          id="send"
          class="send"
          disabled>
          ↑
        </button>

      </div>

      <div class="hint">
        Enter to send · Shift+Enter for a new line · AI runs on your device
      </div>

    </div>

  </main>


  <script type="module" src="app.js"></script>

</body>
</html>
