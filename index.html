<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">J</div>
      <div>
        <div class="brand-name">JARVIS</div>
        <div class="brand-status">AI ASSISTANT</div>
      </div>
    </div>

    <button class="new-chat" id="newChat">
      <span>＋</span>
      New Chat
    </button>

    <div class="sidebar-title">CONVERSATIONS</div>
    <div id="conversationList" class="conversation-list"></div>

    <div class="sidebar-bottom">
      <button id="clearChats" class="side-button">
        Clear Conversations
      </button>

      <div class="model-info">
        <span class="status-dot"></span>
        Jarvis Online
      </div>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <button class="menu-button" id="menuButton">☰</button>

      <div class="mobile-brand">
        <div class="brand-mark small">J</div>
        <span>JARVIS</span>
      </div>

      <div class="topbar-right">
        <span class="model-label">Qwen3 235B</span>
      </div>
    </header>

    <section class="chat-area" id="chatArea">

      <div id="welcome" class="welcome">
        <div class="hero-logo">J</div>

        <h1>How can I help?</h1>

        <p>
          I'm Jarvis, your personal AI assistant.
        </p>

        <div class="suggestions">

          <button data-prompt="Explain something difficult to me in a simple way.">
            <strong>Explain</strong>
            <span>Break down something complicated</span>
          </button>

          <button data-prompt="Help me write something professional.">
            <strong>Write</strong>
            <span>Create or improve writing</span>
          </button>

          <button data-prompt="Help me solve a difficult problem step by step.">
            <strong>Reason</strong>
            <span>Work through a difficult problem</span>
          </button>

          <button data-prompt="Help me write and debug code.">
            <strong>Code</strong>
            <span>Build and debug software</span>
          </button>

        </div>
      </div>

      <div id="messages" class="messages"></div>

    </section>

    <div class="composer-wrapper">

      <div id="filePreview" class="file-preview"></div>

      <div class="composer">

        <button id="attachButton" class="attach-button" title="Attach files">
          +
        </button>

        <input
          type="file"
          id="fileInput"
          multiple
          accept="image/*,.pdf,.txt,.md,.csv,.json,.doc,.docx"
          hidden
        >

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message Jarvis..."
          autocomplete="off"
        ></textarea>

        <button id="sendButton" class="send-button">
          ↑
        </button>

      </div>

      <div class="composer-note">
        Jarvis can make mistakes. Verify important information.
      </div>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
